<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦆</text></svg>">
<title>Knitty Designer</title>
<style>
  :root {
    --bg: #f7f4ef;
    --surface: #ffffff;
    --panel: #f0ece4;
    --border: #c8bfb0;
    --accent: #7c5c3e;
    --accent2: #b8865a;
    --text: #2a1f14;
    --text2: #6b5c4a;
    --header-text: #f7f4ef;
    --btn-primary-text: #f7f4ef;
    --btn-secondary-hover: #ede7df;
    --stitch-active-bg: #e8e0d6;
    --toggle-track: #c8bfb0;
    --toggle-knob: #ffffff;
    --modal-overlay: rgba(42,31,20,0.42);
    --modal-shadow: rgba(42,31,20,0.22);
    --focus-ring: rgba(184,134,90,0.18);
    --canvas-empty: #ffffff;
    --canvas-fill: #f5f0e8;
    --canvas-border: #c8bfb0;
    --canvas-symbol: #2a1f14;
    --canvas-shadow: rgba(124,92,62,0.10);
    --error: #9a3b2e;
  }
  [data-theme="dark"] {
    --bg: #1a1612;
    --surface: #252019;
    --panel: #1f1b16;
    --border: #3d342a;
    --accent: #c4a882;
    --accent2: #d4bc98;
    --text: #e8dfd3;
    --text2: #a89880;
    --header-text: #c4a882;
    --header-bg: #3d2e20;
    --btn-primary-text: #1a1612;
    --btn-secondary-hover: #2e2820;
    --stitch-active-bg: #2e2820;
    --toggle-track: #3d342a;
    --toggle-knob: #e8dfd3;
    --modal-overlay: rgba(0,0,0,0.58);
    --modal-shadow: rgba(0,0,0,0.45);
    --focus-ring: rgba(212,188,152,0.22);
    --canvas-empty: #2a241e;
    --canvas-fill: #322c24;
    --canvas-border: #4a4034;
    --canvas-symbol: #e8dfd3;
    --canvas-shadow: rgba(0,0,0,0.38);
    --error: #d48472;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color 0.22s, color 0.22s;
  }
  header {
    background: var(--header-bg, var(--accent));
    color: var(--header-text);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    transition: background-color 0.22s, color 0.22s;
  }
  header h1 { font-size: 1.2rem; letter-spacing: 0.04em; font-weight: normal; flex: 1; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 230px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    transition: background-color 0.22s, border-color 0.22s;
  }
  .sidebar-section { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
  .sidebar-section h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text2);
    margin-bottom: 10px;
  }
  .field-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .field-row label { font-size: 0.82rem; color: var(--text2); width: 56px; flex-shrink: 0; }
  .field-row input[type=number] {
    width: 64px; padding: 4px 6px;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--surface); font-size: 0.85rem; color: var(--text);
  }
  button { cursor: pointer; border: none; border-radius: 3px; font-family: inherit; }
  .btn-primary {
    background: var(--accent); color: var(--btn-primary-text);
    padding: 6px 12px; font-size: 0.82rem; letter-spacing: 0.04em;
    width: 100%; margin-top: 4px;
    transition: background 0.15s, color 0.22s;
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary {
    background: var(--surface); color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 12px; font-size: 0.82rem;
    width: 100%; margin-top: 6px;
    transition: background 0.15s, color 0.22s, border-color 0.22s;
  }
  .btn-secondary:hover { background: var(--btn-secondary-hover); }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary:disabled:hover { background: var(--surface); }
  .btn-row { display: flex; gap: 6px; }
  .btn-row button { flex: 1; margin-top: 0; }

  /* Stitch list */
  .stitch-list { display: flex; flex-direction: column; gap: 5px; }
  .stitch-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px; border-radius: 3px;
    border: 2px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  .stitch-item.active { background: var(--stitch-active-bg); border-color: var(--accent); }
  .stitch-item.disabled { opacity: 0.38; }
  .stitch-select { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
  .stitch-label { font-size: 0.78rem; color: var(--text); line-height: 1.2; }

  /* Toggle pill */
  .stitch-toggle { position: relative; flex-shrink: 0; width: 30px; height: 17px; }
  .stitch-toggle input { opacity: 0; width: 0; height: 0; }
  .stitch-toggle-track {
    position: absolute; inset: 0; border-radius: 17px;
    background: var(--toggle-track); cursor: pointer; transition: background 0.2s;
  }
  .stitch-toggle input:checked + .stitch-toggle-track { background: var(--accent2); }
  .stitch-toggle-track::before {
    content: '';
    position: absolute; width: 11px; height: 11px;
    border-radius: 50%; background: var(--toggle-knob);
    top: 3px; left: 3px; transition: transform 0.2s, background 0.22s;
  }
  .stitch-toggle input:checked + .stitch-toggle-track::before { transform: translateX(13px); }

  /* Dark mode toggles — outline style instead of fill */
  [data-theme="dark"] .stitch-toggle-track {
    background: transparent;
    border: 1px solid var(--border);
  }
  [data-theme="dark"] .stitch-toggle-track::before {
    background: var(--text2);
    top: 2px; left: 2px;
  }
  [data-theme="dark"] .stitch-toggle input:checked + .stitch-toggle-track {
    background: transparent;
    border: 1px solid var(--accent2);
  }
  [data-theme="dark"] .stitch-toggle input:checked + .stitch-toggle-track::before {
    background: var(--accent2);
    top: 2px; left: 2px;
    transform: translateX(12px);
  }

  /* Canvas area */
  .canvas-area {
    flex: 1; overflow: auto;
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 20px; background: var(--bg);
    transition: background-color 0.22s;
  }
  #grid-outer { display: inline-flex; flex-direction: column; user-select: none; }
  #col-ruler { display: flex; }
  #grid-row-wrap { display: flex; }
  #row-ruler { display: flex; flex-direction: column; }
  .ruler-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text2);
    font-family: monospace; flex-shrink: 0;
  }
  #grid-canvas {
    display: block; cursor: crosshair;
    border: 2px solid var(--accent);
    box-shadow: 0 4px 24px var(--canvas-shadow);
  }
  .theme-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 4px;
  }
  .theme-label { font-size: 0.82rem; color: var(--text); }
  .hint { font-size: 0.72rem; color: var(--text2); line-height: 1.5; margin-top: 8px; }
  #export-status, #save-status {
    font-size: 0.75rem; color: var(--accent2);
    margin-top: 6px; min-height: 16px; text-align: center;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: var(--modal-overlay);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
    opacity: 0; visibility: hidden;
    transition: opacity 0.18s, visibility 0.18s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 10px 36px var(--modal-shadow);
    width: min(480px, 100%);
    max-height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .modal-header h2 { font-size: 0.95rem; font-weight: normal; letter-spacing: 0.04em; color: var(--text); }
  .modal-close {
    background: none; border: none;
    color: var(--text2); font-size: 1.35rem; line-height: 1;
    padding: 0 2px; cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-desc { font-size: 0.82rem; color: var(--text2); line-height: 1.45; margin-bottom: 10px; }
  .modal-textarea {
    width: 100%; min-height: 120px; max-height: 220px;
    padding: 8px 10px; resize: vertical;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--bg); font-size: 0.78rem;
    font-family: monospace; color: var(--text); line-height: 1.4;
  }
  .modal-textarea:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 2px var(--focus-ring); }
  .modal-error { font-size: 0.78rem; color: var(--error); margin-top: 8px; min-height: 0; }
  .modal-error:empty { display: none; }
  .modal-footer {
    display: flex; gap: 8px;
    padding: 10px 16px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .modal-footer button { flex: 1; margin-top: 0; }
</style>
<script>
  if (localStorage.getItem('knitty-theme') === 'dark')
    document.documentElement.setAttribute('data-theme', 'dark');
</script>
</head>
<body>

<header>
  <h1>🦆 Knitty Designer 1.9</h1>
</header>

<div class="main">
  <div class="sidebar">

    <div class="sidebar-section">
      <h3>Projekt</h3>
      <div class="field-row">
        <label>Kolumny</label>
        <input type="number" id="inp-cols" value="20" min="2" max="120">
      </div>
      <div class="field-row">
        <label>Wiersze</label>
        <input type="number" id="inp-rows" value="20" min="2" max="120">
      </div>
      <div class="field-row">
        <label>Rozmiar</label>
        <input type="number" id="inp-cell" value="32" min="16" max="64">px
      </div>
      <button class="btn-primary" id="btn-resize">Zastosuj</button>
      <br><br>
      <div class="theme-row">
        <span class="theme-label">Tryb ciemny</span>
        <label class="stitch-toggle" title="Przełącz tryb ciemny">
          <input type="checkbox" id="toggle-dark-mode">
          <span class="stitch-toggle-track"></span>
        </label>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Ścieg (aktywny)</h3>
      <div class="stitch-list" id="stitch-list"></div>
      <p class="hint">LMB – rysuj / zmień ścieg<br>RMB – usuń ścieg</p>
    </div>

    <div class="sidebar-section">
      <h3>Eksport</h3>
      <button class="btn-primary" id="btn-pdf">Eksportuj PDF</button>
      <button class="btn-secondary" id="btn-jpg">Eksportuj JPG</button>
      <div id="export-status"></div>
    </div>

    <div class="sidebar-section">
      <h3>Edycja</h3>
      <div class="btn-row">
        <button class="btn-secondary" id="btn-undo" title="CTRL+Z" disabled>Cofnij</button>
        <button class="btn-secondary" id="btn-redo" title="CTRL+Y" disabled>Ponów</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h3>Pozostałe</h3>
      <button class="btn-secondary" id="btn-clear">Wyczyść siatkę</button>
      <button class="btn-primary" id="btn-export-hash">Generuj kod zapisu</button>
      <button class="btn-secondary" id="btn-import-hash">Wczytaj z kodu</button>
      <div id="save-status"></div>
    </div>

  </div>

  <div class="canvas-area">
    <div id="grid-outer">
      <div style="display:flex">
        <div id="row-ruler-spacer"></div>
        <div id="col-ruler"></div>
      </div>
      <div id="grid-row-wrap">
        <div id="row-ruler"></div>
        <canvas id="grid-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Hash modal -->
<div id="hash-modal-overlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="hash-modal-title">
    <div class="modal-header">
      <h2 id="hash-modal-title"></h2>
      <button type="button" class="modal-close" id="hash-modal-close" aria-label="Zamknij">&times;</button>
    </div>
    <div class="modal-body">
      <p id="hash-modal-desc" class="modal-desc"></p>
      <textarea id="hash-modal-text" class="modal-textarea" rows="6"></textarea>
      <p id="hash-modal-error" class="modal-error"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-primary" id="hash-modal-primary"></button>
      <button type="button" class="btn-secondary" id="hash-modal-secondary"></button>
    </div>
  </div>
</div>

<!-- Confirm modal -->
<div id="confirm-modal-overlay" class="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="modal-header">
      <h2 id="confirm-modal-title"></h2>
      <button type="button" class="modal-close" id="confirm-modal-close" aria-label="Zamknij">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirm-modal-desc" class="modal-desc"></p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-primary" id="confirm-modal-primary"></button>
      <button type="button" class="btn-secondary" id="confirm-modal-secondary"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ─── Stitch definitions ───────────────────────────────────────────────
const STITCHES = [
  {
    id: 'kaczka',
    label: 'Square',
    draw(ctx, x, y, s) {
      const orig = ctx.lineWidth;
      ctx.beginPath();
      ctx.rect(x + s*0.28, y + s*0.28, s*0.44, s*0.44);
      ctx.lineWidth = s * 0.44;
      ctx.stroke();
      ctx.lineWidth = orig;
    }
  },
  {
    id: 'p_rs',
    label: 'Dot',
    draw(ctx, x, y, s) {
      ctx.beginPath();
      ctx.arc(x + s/2, y + s/2, s*0.22, 0, Math.PI*2);
      ctx.fill();
    }
  },
  {
    id: 'yo',
    label: 'Circle',
    draw(ctx, x, y, s) {
      ctx.beginPath();
      ctx.arc(x + s/2, y + s/2, s*0.30, 0, Math.PI*2);
      ctx.stroke();
    }
  },
  {
    id: 'ssk',
    label: 'SSK',
    draw(ctx, x, y, s) {
      ctx.beginPath();
      ctx.moveTo(x + s*0.75, y + s*0.15);
      ctx.lineTo(x + s*0.15, y + s*0.85);
      ctx.stroke();
    }
  },
];

// ─── State ────────────────────────────────────────────────────────────
let COLS = 20, ROWS = 20, CELL = 32;
let grid = [];
let activeStitch = 'kaczka';
const enabledSet = new Set([STITCHES[0].id]);

function makeGrid(rows, cols) {
  return Array.from({length: rows}, () => Array(cols).fill(null));
}

function resizeGrid(newRows, newCols) {
  const oldRows = grid.length;
  const oldCols = grid[0]?.length ?? 0;
  const rowOff = Math.floor((newRows - oldRows) / 2);
  const colOff = Math.floor((newCols - oldCols) / 2);
  const ng = makeGrid(newRows, newCols);
  for (let r = 0; r < oldRows; r++) {
    for (let c = 0; c < oldCols; c++) {
      const nr = r + rowOff, nc = c + colOff;
      if (nr >= 0 && nr < newRows && nc >= 0 && nc < newCols)
        ng[nr][nc] = grid[r][c];
    }
  }
  grid = ng;
}

grid = makeGrid(ROWS, COLS);

// ─── Undo / Redo ─────────────────────────────────────────────────────
const MAX_HISTORY = 50;
let undoStack = [], redoStack = [];

const cloneGrid = g => g.map(row => row.slice());

function pushHistory() {
  undoStack.push(cloneGrid(grid));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(cloneGrid(grid));
  grid = undoStack.pop();
  redraw(); updateUndoRedoButtons();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(cloneGrid(grid));
  grid = redoStack.pop();
  redraw(); updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
  document.getElementById('btn-undo').disabled = !undoStack.length;
  document.getElementById('btn-redo').disabled = !redoStack.length;
}

function clearDrawHistory() {
  undoStack = []; redoStack = [];
  updateUndoRedoButtons();
}

// ─── Mouse state ──────────────────────────────────────────────────────
let isDrawing = false, drawMode = null, lastDragCell = null;

// ─── Canvas setup ─────────────────────────────────────────────────────
const canvas = document.getElementById('grid-canvas');
const ctx    = canvas.getContext('2d');
const RULER_W = 28;

const canvasWidth  = () => COLS * CELL;
const canvasHeight = () => ROWS * CELL;

function initCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const W = canvasWidth(), H = canvasHeight();
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildRulers();
}

function buildRulers() {
  const colRuler = document.getElementById('col-ruler');
  const rowRuler = document.getElementById('row-ruler');
  const spacer   = document.getElementById('row-ruler-spacer');

  spacer.style.width = RULER_W + 'px';
  spacer.style.flexShrink = '0';

  colRuler.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const el = document.createElement('div');
    el.className = 'ruler-cell';
    el.style.cssText = `width:${CELL}px;height:${RULER_W}px;flex-shrink:0`;
    el.textContent = colLabel(c);
    colRuler.appendChild(el);
  }

  rowRuler.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const el = document.createElement('div');
    el.className = 'ruler-cell';
    el.style.cssText = `width:${RULER_W}px;height:${CELL}px;flex-shrink:0`;
    el.textContent = r + 1;
    rowRuler.appendChild(el);
  }
}

function colLabel(c) {
  let label = '';
  c++;
  while (c > 0) {
    c--;
    label = String.fromCharCode(65 + (c % 26)) + label;
    c = Math.floor(c / 26);
  }
  return label;
}

// ─── Theme ────────────────────────────────────────────────────────────
const THEME_KEY = 'knitty-theme';

function getCanvasColors() {
  const s = getComputedStyle(document.documentElement);
  return {
    border: s.getPropertyValue('--canvas-border').trim(),
    symbol: s.getPropertyValue('--canvas-symbol').trim(),
    fill:   s.getPropertyValue('--canvas-fill').trim(),
    empty:  s.getPropertyValue('--canvas-empty').trim(),
  };
}

function applyTheme(dark) {
  if (dark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem(THEME_KEY, 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(THEME_KEY, 'light');
  }
  buildStitchUI();
  redraw();
}

function initTheme() {
  const toggle = document.getElementById('toggle-dark-mode');
  const dark = localStorage.getItem(THEME_KEY) === 'dark'
    || document.documentElement.getAttribute('data-theme') === 'dark';
  toggle.checked = dark;
  toggle.addEventListener('change', () => applyTheme(toggle.checked));
}

// ─── Drawing ──────────────────────────────────────────────────────────
function getActiveCycle() {
  return STITCHES.filter(s => enabledSet.has(s.id)).map(s => s.id);
}

function drawCell(r, c) {
  const colors = getCanvasColors();
  const x = c * CELL, y = r * CELL, s = CELL;
  const stId = grid[r][c];

  ctx.fillStyle = (stId && stId !== 'empty') ? colors.fill : colors.empty;
  ctx.fillRect(x+1, y+1, s-1, s-1);

  if (stId && stId !== 'empty') {
    const st = STITCHES.find(st => st.id === stId);
    if (st?.draw) {
      ctx.strokeStyle = colors.symbol;
      ctx.fillStyle   = colors.symbol;
      ctx.lineWidth   = Math.max(1.5, s*0.055);
      ctx.lineCap     = 'round';
      st.draw(ctx, x, y, s);
    }
  }
}

function redraw() {
  const colors = getCanvasColors();
  const W = canvasWidth(), H = canvasHeight();
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = colors.border;
  ctx.lineWidth   = 0.5;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*CELL); ctx.lineTo(W, r*CELL); ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*CELL, 0); ctx.lineTo(c*CELL, H); ctx.stroke();
  }

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      drawCell(r, c);
}

// ─── Stitch UI ────────────────────────────────────────────────────────
function buildStitchUI() {
  const colors = getCanvasColors();
  const list = document.getElementById('stitch-list');
  list.innerHTML = '';

  STITCHES.forEach(st => {
    const item = document.createElement('div');
    item.className = 'stitch-item';
    if (st.id === activeStitch) item.classList.add('active');
    if (!enabledSet.has(st.id)) item.classList.add('disabled');
    item.dataset.id = st.id;

    // Icon via offscreen canvas → SVG image
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '26'); svg.setAttribute('height', '26');
    svg.setAttribute('viewBox', '0 0 26 26');

    const bg = document.createElementNS(svgNS, 'rect');
    bg.setAttribute('x','0.5'); bg.setAttribute('y','0.5');
    bg.setAttribute('width','25'); bg.setAttribute('height','25');
    bg.setAttribute('fill', st.id === 'empty' ? colors.empty : colors.fill);
    bg.setAttribute('stroke', colors.border); bg.setAttribute('stroke-width','1');
    svg.appendChild(bg);

    if (st.draw) {
      const oc = document.createElement('canvas');
      oc.width = oc.height = 26;
      const oc2 = oc.getContext('2d');
      oc2.strokeStyle = oc2.fillStyle = colors.symbol;
      oc2.lineWidth = 1.6; oc2.lineCap = 'round';
      st.draw(oc2, 0, 0, 26);
      const img = document.createElementNS(svgNS, 'image');
      img.setAttribute('href', oc.toDataURL());
      img.setAttribute('x','0'); img.setAttribute('y','0');
      img.setAttribute('width','26'); img.setAttribute('height','26');
      svg.appendChild(img);
    }

    const label = document.createElement('div');
    label.className = 'stitch-label';
    label.textContent = st.label;

    const selectArea = document.createElement('div');
    selectArea.className = 'stitch-select';
    selectArea.append(svg, label);
    selectArea.addEventListener('click', () => {
      if (!enabledSet.has(st.id)) return;
      activeStitch = st.id;
      ensureActiveStitchValid();
      refreshStitchUI();
    });

    const toggleLabel = document.createElement('label');
    toggleLabel.className = 'stitch-toggle';
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = enabledSet.has(st.id);
    const track = document.createElement('div');
    track.className = 'stitch-toggle-track';
    toggleLabel.append(chk, track);

    chk.addEventListener('change', () => {
      if (chk.checked) {
        enabledSet.add(st.id);
      } else {
        if (getActiveCycle().length <= 1) { chk.checked = true; return; }
        enabledSet.delete(st.id);
      }
      item.classList.toggle('disabled', !enabledSet.has(st.id));
      ensureActiveStitchValid();
      refreshStitchUI();
    });

    item.append(selectArea, toggleLabel);
    list.appendChild(item);
  });
}

function refreshStitchUI() {
  document.querySelectorAll('.stitch-item').forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle('active', id === activeStitch);
    el.classList.toggle('disabled', !enabledSet.has(id));
  });
}

function ensureActiveStitchValid() {
  const cycle = getActiveCycle();
  if (!cycle.includes(activeStitch)) activeStitch = cycle[0] ?? 'kaczka';
}

// ─── Mouse interaction ────────────────────────────────────────────────
function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left)  / CELL);
  const r = Math.floor((e.clientY - rect.top) / CELL);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
  return {r, c};
}

function applyCell(r, c, isFirstClick) {
  if (drawMode === 'erase') {
    if (grid[r][c] !== null) { grid[r][c] = null; drawCell(r, c); }
    return;
  }
  if (isFirstClick) {
    const cur = grid[r][c];
    const cycle = getActiveCycle();
    if (cur === null || !cycle.includes(cur)) {
      grid[r][c] = activeStitch;
    } else {
      grid[r][c] = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
      activeStitch = grid[r][c];
      refreshStitchUI();
    }
  } else {
    if (grid[r][c] !== activeStitch) grid[r][c] = activeStitch;
  }
  drawCell(r, c);
}

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const cell = cellFromEvent(e);
  if (!cell) return;
  isDrawing = true;
  drawMode = e.button === 2 ? 'erase' : 'draw';
  lastDragCell = cell;
  pushHistory();
  applyCell(cell.r, cell.c, true);
});

canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const cell = cellFromEvent(e);
  if (!cell) return;
  if (lastDragCell && cell.r === lastDragCell.r && cell.c === lastDragCell.c) return;
  lastDragCell = cell;
  applyCell(cell.r, cell.c, false);
});

window.addEventListener('mouseup', () => {
  isDrawing = false; drawMode = null; lastDragCell = null;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─── Resize ───────────────────────────────────────────────────────────
document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-redo').addEventListener('click', redo);

document.getElementById('btn-resize').addEventListener('click', () => {
  const newCols = Math.max(2, Math.min(120, parseInt(document.getElementById('inp-cols').value) || COLS));
  const newRows = Math.max(2, Math.min(120, parseInt(document.getElementById('inp-rows').value) || ROWS));
  const newCell = Math.max(16, Math.min(64,  parseInt(document.getElementById('inp-cell').value) || CELL));
  resizeGrid(newRows, newCols);
  COLS = newCols; ROWS = newRows; CELL = newCell;
  clearDrawHistory();
  initCanvas(); redraw();
});

// ─── Export JPG ───────────────────────────────────────────────────────
document.getElementById('btn-jpg').addEventListener('click', () => {
  const status = document.getElementById('export-status');
  status.textContent = 'Generowanie JPG…';
  setTimeout(() => {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const W = COLS*CELL + RULER_W + 20, H = ROWS*CELL + RULER_W + 20;
    const oc  = document.createElement('canvas');
    oc.width = W; oc.height = H;
    const oc2 = oc.getContext('2d');
    oc2.fillStyle = dark ? '#1a1612' : '#ffffff';
    oc2.fillRect(0, 0, W, H);
    oc2.drawImage(canvas, 0, 0, COLS*CELL, ROWS*CELL, RULER_W, RULER_W, COLS*CELL, ROWS*CELL);
    oc2.fillStyle = dark ? '#a89880' : '#6b5c4a';
    oc2.font = '10px monospace';
    oc2.textAlign = 'center'; oc2.textBaseline = 'middle';
    for (let c = 0; c < COLS; c++)
      oc2.fillText(colLabel(c), RULER_W + c*CELL + CELL/2, RULER_W/2);
    oc2.textAlign = 'right';
    for (let r = 0; r < ROWS; r++)
      oc2.fillText(r+1, RULER_W-3, RULER_W + r*CELL + CELL/2);
    const link = document.createElement('a');
    link.download = 'knitty-pattern.jpg';
    link.href = oc.toDataURL('image/jpeg', 0.95);
    link.click();
    status.textContent = 'JPG gotowy!';
    setTimeout(() => status.textContent = '', 2000);
  }, 50);
});

// ─── Export PDF ───────────────────────────────────────────────────────
document.getElementById('btn-pdf').addEventListener('click', async () => {
  const status = document.getElementById('export-status');
  status.textContent = 'Generowanie PDF…';
  await new Promise(r => setTimeout(r, 20));
  try {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    const pBg       = dark ? [26,22,18]     : [255,255,255];
    const pEmpty    = dark ? [42,36,30]      : [255,255,255];
    const pFill     = dark ? [50,44,36]      : [245,240,232];
    const pGridLine = dark ? [74,64,52]      : [200,191,176];
    const pSymbol   = dark ? [232,223,211]   : [42,31,20];
    const pRuler    = dark ? [168,152,128]   : [107,92,74];
    const pTitle    = dark ? [196,168,130]   : [124,92,62];

    const { jsPDF } = window.jspdf;
    const margin = 28, rulerPt = 18;
    const cPt = CELL * (72/96);
    const W = COLS*cPt + 2*margin + rulerPt;
    const H = ROWS*cPt + 2*margin + rulerPt + 30;
    const doc = new jsPDF({ orientation: W > H ? 'landscape' : 'portrait', unit: 'pt', format: [W, H] });
    const ox = margin + rulerPt, oy = margin + rulerPt;

    if (dark) { doc.setFillColor(...pBg); doc.rect(0, 0, W, H, 'F'); }

    doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
    doc.setTextColor(...pTitle);
    doc.text('Knitty Designer 1.9', margin, margin - 8);

    doc.setFontSize(6); doc.setFont('helvetica', 'normal');
    doc.setTextColor(...pRuler);
    for (let c = 0; c < COLS; c++)
      doc.text(colLabel(c), ox + c*cPt + cPt/2, oy - 4, { align: 'center' });
    for (let r = 0; r < ROWS; r++)
      doc.text(String(r+1), ox - 3, oy + r*cPt + cPt/2 + 2, { align: 'right' });

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = ox + c*cPt, y = oy + r*cPt;
        const stId = grid[r][c];
        doc.setFillColor(...(stId && stId !== 'empty' ? pFill : pEmpty));
        doc.rect(x, y, cPt, cPt, 'F');
        doc.setDrawColor(...pGridLine); doc.setLineWidth(0.3);
        doc.rect(x, y, cPt, cPt, 'S');
        if (stId && stId !== 'empty') {
          doc.setDrawColor(...pSymbol); doc.setFillColor(...pSymbol);
          const lw = Math.max(0.6, cPt*0.055);
          doc.setLineWidth(lw);
          const cx = x+cPt/2, cy = y+cPt/2;
          if      (stId === 'p_rs')   doc.circle(cx, cy, cPt*0.22, 'F');
          else if (stId === 'yo')     doc.circle(cx, cy, cPt*0.30, 'S');
          else if (stId === 'ssk')    doc.line(x+cPt*0.75, y+cPt*0.15, x+cPt*0.15, y+cPt*0.85);
          else if (stId === 'kaczka') {
            doc.setLineWidth(cPt*0.44);
            doc.rect(x+cPt*0.28, y+cPt*0.28, cPt*0.44, cPt*0.44, 'S');
            doc.setLineWidth(lw);
          }
        }
      }
    }

    doc.save('knitty-pattern.pdf');
    status.textContent = 'PDF gotowy!';
    setTimeout(() => status.textContent = '', 2000);
  } catch(err) {
    status.textContent = 'Błąd: ' + err.message;
    console.error(err);
  }
});

// ─── Save & Load (RLE + Base62) ───────────────────────────────────────
// Base62 charset: 0-9 A-Z a-z — only alphanumeric, no special chars
const B62 = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

function toBase62(bytes) {
  // Convert Uint8Array → BigInt → Base62 string
  let n = 0n;
  for (const b of bytes) n = (n << 8n) | BigInt(b);
  if (n === 0n) return '0';
  let result = '';
  const base = 62n;
  while (n > 0n) {
    result = B62[Number(n % base)] + result;
    n /= base;
  }
  return result;
}

function fromBase62(str) {
  // Base62 string → BigInt → Uint8Array
  let n = 0n;
  for (const ch of str) {
    const idx = B62.indexOf(ch);
    if (idx < 0) throw new Error('Nieprawidłowy znak w kodzie: ' + ch);
    n = n * 62n + BigInt(idx);
  }
  const bytes = [];
  while (n > 0n) { bytes.unshift(Number(n & 0xFFn)); n >>= 8n; }
  return new Uint8Array(bytes);
}

// Stitch char map — single char per stitch id
const STITCH_MAP = { p_rs: 'P', kaczka: 'K', yo: 'Y', ssk: 'S', empty: '_' };
const REVERSE_STITCH_MAP = Object.fromEntries(
  Object.entries(STITCH_MAP).map(([k, v]) => [v, k])
);

function generateProjectCode() {
  // 1. Flatten grid → RLE string
  const flat = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      flat.push(STITCH_MAP[grid[r][c]] ?? '_');

  let rle = '';
  let count = 1;
  for (let i = 0; i < flat.length; i++) {
    if (flat[i] === flat[i+1]) { count++; }
    else { rle += count + flat[i]; count = 1; }
  }

  // 2. JSON → UTF-8 bytes → Base62
  const json = JSON.stringify({ w: ROWS, k: COLS, d: rle });
  const bytes = new TextEncoder().encode(json);
  return toBase62(bytes);
}

function loadProjectFromCode(code) {
  try {
    const bytes = fromBase62(code.trim());
    const json  = new TextDecoder().decode(bytes);
    const proj  = JSON.parse(json);

    if (!proj.w || !proj.k || !proj.d) throw new Error('Nieprawidłowy format danych.');

    ROWS = proj.w; COLS = proj.k;
    document.getElementById('inp-rows').value = ROWS;
    document.getElementById('inp-cols').value = COLS;

    const flat = [];
    const rx = /(\d+)(.)/g;
    let m;
    while ((m = rx.exec(proj.d)) !== null) {
      const stId = REVERSE_STITCH_MAP[m[2]] ?? null;
      for (let i = 0; i < +m[1]; i++) flat.push(stId === 'empty' ? null : stId);
    }

    if (flat.length !== ROWS * COLS) throw new Error('Niezgodność wymiarów siatki.');

    grid = makeGrid(ROWS, COLS);
    let idx = 0;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        grid[r][c] = flat[idx++];

    clearDrawHistory(); initCanvas(); redraw();
    const status = document.getElementById('save-status');
    status.textContent = 'Projekt wczytany!';
    setTimeout(() => status.textContent = '', 2000);
    return true;
  } catch(err) {
    console.error(err);
    return false;
  }
}

// ─── Hash modal ───────────────────────────────────────────────────────
const hashModalOverlay   = document.getElementById('hash-modal-overlay');
const hashModalTitle     = document.getElementById('hash-modal-title');
const hashModalDesc      = document.getElementById('hash-modal-desc');
const hashModalText      = document.getElementById('hash-modal-text');
const hashModalError     = document.getElementById('hash-modal-error');
const hashModalPrimary   = document.getElementById('hash-modal-primary');
const hashModalSecondary = document.getElementById('hash-modal-secondary');
const hashModalClose     = document.getElementById('hash-modal-close');
let hashModalOnPrimary   = null;

function closeHashModal() {
  hashModalOverlay.classList.remove('open');
  hashModalOverlay.setAttribute('aria-hidden', 'true');
  hashModalOnPrimary = null;
}

function openHashModal({ title, description, text, readOnly, primaryLabel, secondaryLabel, onPrimary }) {
  hashModalTitle.textContent    = title;
  hashModalDesc.textContent     = description;
  hashModalText.value           = text || '';
  hashModalText.readOnly        = !!readOnly;
  hashModalError.textContent    = '';
  hashModalPrimary.textContent  = primaryLabel;
  hashModalSecondary.textContent= secondaryLabel;
  hashModalOnPrimary = onPrimary;
  hashModalOverlay.classList.add('open');
  hashModalOverlay.setAttribute('aria-hidden', 'false');
  hashModalText.focus();
  if (readOnly) hashModalText.select();
}

async function copyHashModalText() {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(hashModalText.value);
    } else {
      hashModalText.select();
      document.execCommand('copy');
    }
    const orig = hashModalPrimary.textContent;
    hashModalPrimary.textContent = 'Skopiowano!';
    setTimeout(() => hashModalPrimary.textContent = orig, 1500);
  } catch(err) {
    hashModalError.textContent = 'Nie udało się skopiować — zaznacz tekst ręcznie.';
    console.error(err);
  }
}

hashModalPrimary.addEventListener('click', () => hashModalOnPrimary?.());
hashModalSecondary.addEventListener('click', closeHashModal);
hashModalClose.addEventListener('click', closeHashModal);
hashModalOverlay.addEventListener('click', e => { if (e.target === hashModalOverlay) closeHashModal(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (confirmModalOverlay.classList.contains('open')) closeConfirmModal();
    else if (hashModalOverlay.classList.contains('open')) closeHashModal();
    return;
  }
  if (e.target.matches('input, textarea')) return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
});

document.getElementById('btn-export-hash').addEventListener('click', () => {
  openHashModal({
    title: 'Kod zapisu',
    description: 'Skopiuj poniższy kod i zapisz go w bezpiecznym miejscu:',
    text: generateProjectCode(),
    readOnly: true,
    primaryLabel: 'Kopiuj',
    secondaryLabel: 'Zamknij',
    onPrimary: copyHashModalText
  });
});

document.getElementById('btn-import-hash').addEventListener('click', () => {
  openHashModal({
    title: 'Wczytaj z kodu',
    description: 'Wklej tutaj swój kod zapisu projektu:',
    text: '',
    readOnly: false,
    primaryLabel: 'Wczytaj',
    secondaryLabel: 'Anuluj',
    onPrimary: () => {
      const code = hashModalText.value.trim();
      if (!code) { hashModalError.textContent = 'Wklej kod zapisu, aby wczytać projekt.'; return; }
      if (loadProjectFromCode(code)) closeHashModal();
      else hashModalError.textContent = 'Podany kod zapisu jest nieprawidłowy lub uszkodzony.';
    }
  });
});

// ─── Init ─────────────────────────────────────────────────────────────
initTheme();
buildStitchUI();
initCanvas();
redraw();
